<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>GC Overlay - Live</title>
    <link rel="stylesheet" href="overlay.css?v=17" />
  </head>
  <body class="overlay-body">
    <main class="broadcast-frame" id="overlayRoot">
      <section class="like-bar" id="likeBar" hidden aria-live="polite">
        <div class="like-bar-brand">OWTV</div>
        <div class="like-bar-main">
          <div class="like-bar-heading"><span>META DE LIKES</span><strong><span id="overlayLikeCount">—</span> <small>LIKES</small></strong></div>
          <div class="like-bar-track"><span id="overlayLikeFill"></span></div>
        </div>
        <div class="like-bar-goal"><span>META</span><strong id="overlayLikeGoal">—</strong></div>
        <div class="like-bar-celebration" id="likeCelebration" hidden>META BATIDA!</div>
      </section>
      <section class="chat-highlight" id="chatHighlight" hidden>
        <div class="chat-highlight-heading">CHAT EM DESTAQUE</div>
        <strong id="chatHighlightAuthor"></strong>
        <p id="chatHighlightText"></p>
      </section>

      <section class="lower-third" id="lowerThird" hidden>
        <div class="logo-box">
          <img id="logoImage" alt="" />
        </div>
        <div class="gc-text">
          <h1 id="gcTitle"></h1>
          <p id="gcSubtitle"></p>
        </div>
      </section>
    </main>

    <script src="shared.js?v=17"></script>
    <script src="overlay.js?v=17"></script>
  </body>
</html>
