<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>GC Overlay - Live</title>
    <link rel="stylesheet" href="overlay.css?v=14" />
  </head>
  <body class="overlay-body">
    <main class="broadcast-frame" id="overlayRoot">
      <section class="chat-highlight" id="chatHighlight" hidden>
        <div class="chat-highlight-heading">CHAT EM DESTAQUE</div>
        <strong id="chatHighlightAuthor"></strong>
        <p id="chatHighlightText"></p>
      </section>

      <section class="lower-third" id="lowerThird" hidden>
        <div class="logo-box">
          <img id="logoImage" alt="" />
        </div>
        <div class="gc-text">
          <h1 id="gcTitle"></h1>
          <p id="gcSubtitle"></p>
        </div>
      </section>
    </main>

    <script src="shared.js?v=14"></script>
    <script src="overlay.js?v=14"></script>
  </body>
</html>
