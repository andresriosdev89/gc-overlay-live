services:
  - type: web
    name: gc-overlay-live
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: ADMIN_KEY
        generateValue: true
    disk:
      name: gc-overlay-data
      mountPath: /app/data
      sizeGB: 1
